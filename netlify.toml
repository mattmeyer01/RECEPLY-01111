[build]
  command = "npm run build"
  publish = "dist"

# Główna domena to receply.pl. Podglądy wdrożeń mają inne adresy, więc ich to nie dotyczy.
[[redirects]]
  from = "https://receply-demo.netlify.app/*"
  to = "https://receply.pl/:splat"
  status = 301
  force = true

# Po żądaniu usunięcia danych Meta odsyła na /usuwanie-danych?kod=… (bez ukośnika na końcu,
# receply-app: funkcja meta-data-deletion). Rewrite podaje stronę od razu pod tym adresem,
# więc kod zostaje w pasku adresu i ramka z potwierdzeniem go widzi.
[[redirects]]
  from = "/usuwanie-danych"
  to = "/usuwanie-danych/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
